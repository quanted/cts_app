name: Create and publish a Docker image

on:
  push:
    branches:
  pull_request:
    types: [opened, reopened]

env:
  REGISTRY: ghcr.io
  CTS_DJANGO_IMAGE_NAME: quanted/cts-django
  CTS_DJANGO_VERSION: 1.2.3

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: Log in to the Container registry
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ${{ env.REGISTRY }}/${{ env.CTS_DJANGO_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}-${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger nginx build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.NGINX_REPO_PAT }}
          IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}
        run: |
          gh api --method POST repos/quanted/cts_nginx/dispatches \
            -f event_type=django-image-updated \
            -f "client_payload[django_tag]=${IMAGE_TAG}"
